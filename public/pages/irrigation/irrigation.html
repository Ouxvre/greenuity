<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Irigasi | Greenuity</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { poppins: ["Poppins", "sans-serif"] },
            colors: {
              primary: "#1B4D57",
              secondary: "#81C784",
              dark: "#2E7D32",
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="bg-gray-50 min-h-screen pb-28 font-poppins overflow-x-hidden max-w-full"
  >
    <!-- Header -->
    <div class="px-6 py-4 sticky top-2 z-10">
      <div class="flex justify-center items-center">
        <h1 class="text-lg font-bold">Irigasi</h1>
      </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 py-6 space-y-6">
      <!-- Kelola Irigasi Section -->
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <h2 class="text-base font-semibold text-gray-800 mb-3">
          Kelola Irigasi
        </h2>

        <!-- Dropdown -->
        <div class="relative mb-4">
          <div id="deviceSelectWrapper" class="relative">
            <button
              id="deviceSelectBtn"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 flex justify-between items-center"
            >
              <span id="deviceSelectLabel">Pilih perangkat</span>
              <svg
                class="w-5 h-5 text-gray-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>

            <div
              id="deviceDropdown"
              class="absolute left-0 right-0 bg-white border border-gray-200 rounded-xl shadow-lg hidden mt-2 z-50 max-h-48 overflow-y-auto"
            >
              <!-- Option will be injected -->
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3">
          <button
            onclick="controlPump()"
            id="btnPump"
            class="flex-1 bg-dark text-white py-3 rounded-xl font-medium text-sm hover:bg-opacity-90 transition"
          >
            Nyalakan Pompa
          </button>

          <button
            onclick="openSettings()"
            class="bg-gray-100 p-3 rounded-xl hover:bg-gray-200 transition"
          >
            <svg
              class="w-6 h-6 text-gray-700"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Status Pompa -->
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex items-center gap-2 mb-4">
          <svg
            class="w-5 h-5 text-primary"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"
              clip-rule="evenodd"
            />
          </svg>
          <h2 class="text-base font-semibold text-gray-800">
            Status pompa air
          </h2>
        </div>

        <div id="pumpLogContainer" class="space-y-3"></div>
      </div>

      <!-- Dynamic content (schedule only) -->
      <div id="dynamicIrrigation"></div>
    </div>

    <!-- SETTINGS MODAL -->
    <div
      id="settingsModal"
      class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm flex justify-center items-center hidden z-[9999]"
    >
      <div
        class="bg-white w-11/12 max-w-md p-6 rounded-2xl shadow-xl space-y-4"
      >
        <h2 class="text-lg font-semibold text-gray-800">
          Pengaturan Threshold
        </h2>

        <!-- Min -->
        <div>
          <label class="block text-sm text-gray-700 mb-1">Min (%)</label>
          <input
            id="modalMin"
            type="number"
            min="0"
            max="100"
            class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary outline-none"
          />
        </div>

        <!-- Max -->
        <div>
          <label class="block text-sm text-gray-700 mb-1">Max (%)</label>
          <input
            id="modalMax"
            type="number"
            min="0"
            max="100"
            class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary outline-none"
          />
        </div>

        <!-- Durasi Pompa -->
        <div>
          <label class="block text-sm text-gray-700 mb-1"
            >Durasi Pompa (detik)</label
          >
          <input
            id="modalDuration"
            type="number"
            min="1"
            class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary outline-none"
          />
        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-3 pt-2">
          <button
            onclick="closeSettings()"
            class="px-4 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-sm"
          >
            Batal
          </button>
          <button
            onclick="saveThresholdFromModal()"
            class="px-4 py-2 rounded-xl bg-primary text-white text-sm"
          >
            Simpan
          </button>
        </div>
      </div>
    </div>

    <!-- SCHEDULE MODAL -->
    <div
      id="scheduleModal"
      class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm flex justify-center items-center hidden z-[9999]"
    >
      <div
        class="bg-white w-11/12 max-w-md p-6 rounded-2xl shadow-xl transform transition-all scale-95 opacity-0"
        id="scheduleModalCard"
      >
        <h2 class="text-lg font-semibold text-gray-800 mb-3">
          Tambah / Edit Jadwal
        </h2>

        <label class="block text-sm text-gray-700 mb-1">Waktu</label>
        <div class="flex gap-2 mb-3">
          <input
            id="scheduleHour"
            type="number"
            min="0"
            max="23"
            placeholder="HH"
            class="w-1/3 p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary outline-none"
          />
          <input
            id="scheduleMinute"
            type="number"
            min="0"
            max="59"
            placeholder="MM"
            class="w-1/3 p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary outline-none"
          />
          <input
            id="scheduleDuration"
            type="number"
            min="1"
            placeholder="Detik"
            class="w-1/3 p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary outline-none"
          />
        </div>

        <p id="scheduleError" class="text-xs text-red-500 hidden mb-2"></p>

        <div class="flex justify-end gap-3">
          <button
            onclick="closeScheduleModal()"
            class="px-4 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-sm"
          >
            Batal
          </button>
          <button
            id="saveScheduleModalBtn"
            class="px-4 py-2 rounded-xl bg-primary text-white text-sm"
          >
            Simpan
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-4 inset-x-0 z-50 px-4">
      <div class="bg-white rounded-3xl shadow-2xl px-6 py-3 max-w-md mx-auto">
        <div class="flex items-center justify-around">
          <button
            onclick="goToHome()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-gray-600 transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            <span class="text-[10px]">Beranda</span>
          </button>

          <button
            onclick="goToMonitoring()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-gray-600 transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              />
            </svg>
            <span class="text-[10px]">Monitoring</span>
          </button>

          <button class="flex flex-col items-center space-y-1 text-primary">
            <svg
              class="w-7 h-7"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"
              />
            </svg>
            <span class="text-[10px] font-semibold">Irigasi</span>
          </button>

          <button
            onclick="goToEducation()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-gray-600 transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
              />
            </svg>
            <span class="text-[10px]">Edukasi</span>
          </button>

          <button
            onclick="goToProfile()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-gray-600 transition"
          >
            <svg
              class="w-7 h-7"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <span class="text-[10px]">Profil</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <!-- Firebase Config -->
    <script src="/js/config/firebase-config.js"></script>

    <!-- Proteksi -->
    <script src="/components/authGuard.js"></script>

    <!-- Irrigation Script -->
    <script src="/js/irrigation/irrigation.js"></script>
  </body>
</html>
