<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Greenuity</title>
    <link
      rel="icon"
      type="image/png"
      href="/../assets/logo/logo-greenuity.svg"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#173D45" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- google font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom color config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "my-bg": "#173D45",
              "my-teal": "#1B4D57",
            },
            fontFamily: { poppins: ["Poppins, sans-serif"] },
          },
        },
      };
    </script>
    <style>
      #sensorChart {
        max-height: 500px; /* batas tinggi maksimum di desktop */
      }
    </style>
  </head>

  <body
    class="bg-my-bg flex items-center justify-center min-h-screen p-4 font-poppins"
  >
    <div class="w-full max-w-md">
      <!-- Logo Section -->
      <div class="text-center mb-8">
        <img
          src="../../assets/logo/login_logo.png"
          alt="Greenuity Logo"
          class="mx-auto w-[190px] h-[190px] object-contain mb-4"
        />
      </div>

      <!-- Login/Register Form Card -->
      <div class="bg-white rounded-3xl shadow-2xl p-8">
        <!-- Tab Navigation -->
        <div class="flex bg-gray-100 rounded-full p-1 mb-6">
          <button
            onclick="switchTab('masuk')"
            id="tabMasuk"
            class="flex-1 py-2.5 px-4 rounded-full bg-white text-gray-800 font-medium shadow-sm transition-all"
          >
            Masuk
          </button>
          <button
            onclick="switchTab('daftar')"
            id="tabDaftar"
            class="flex-1 py-2.5 px-4 rounded-full text-gray-500 font-medium transition-all hover:text-gray-800"
          >
            Daftar
          </button>
        </div>

        <!-- Login Form -->
        <form id="formMasuk" class="space-y-4" onsubmit="handleLogin(event)">
          <!-- Email Input -->
          <div class="relative">
            <div
              class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                />
              </svg>
            </div>
            <input
              type="email"
              placeholder="Email Address"
              id="loginEmail"
              required
              class="w-full pl-12 pr-4 py-3.5 text-sm bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-my-teal focus:border-transparent transition-all"
            />
          </div>

          <!-- Password Input -->
          <div class="relative">
            <div
              class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                />
              </svg>
            </div>
            <input
              type="password"
              placeholder="Password"
              id="loginPassword"
              required
              class="w-full pl-12 pr-12 py-3.5 text-sm bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-my-teal focus:border-transparent transition-all"
            />
            <button
              type="button"
              onclick="togglePassword('loginPassword', this)"
              class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="w-5 h-5 eye-icon"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
              </svg>

              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="w-5 h-5 eye-slash-icon hidden"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
                />
              </svg>
            </button>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between text-sm pt-1">
            <label class="flex items-center cursor-pointer group">
              <input
                type="checkbox"
                class="w-4 h-4 text-my-teal border-gray-300 rounded focus:ring-my-teal cursor-pointer"
              />
              <span
                class="ml-2 text-gray-600 group-hover:text-gray-800 transition-colors"
                >Ingat Saya</span
              >
            </label>
            <a
              href="forgot-password.html"
              class="text-gray-600 hover:text-my-teal transition-colors"
              >Lupa Kata Sandi?</a
            >
          </div>

          <!-- Login Button -->
          <button
            type="submit"
            class="w-full bg-my-teal text-white py-3.5 rounded-2xl font-medium hover:bg-opacity-90 transition-all shadow-lg hover:shadow-xl mt-6"
          >
            Masuk
          </button>
        </form>

        <!-- Register Form -->
        <form
          id="formDaftar"
          class="space-y-4 hidden"
          onsubmit="handleRegister(event)"
        >
          <!-- Name Input -->
          <div class="relative">
            <div
              class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                />
              </svg>
            </div>
            <input
              type="text"
              placeholder="Nama"
              id="registerName"
              required
              class="w-full pl-12 pr-4 py-3.5 text-sm bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-my-teal focus:border-transparent transition-all"
            />
          </div>

          <!-- Email Input -->
          <div class="relative">
            <div
              class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                />
              </svg>
            </div>
            <input
              type="email"
              placeholder="Email Address"
              id="registerEmail"
              required
              class="w-full pl-12 pr-4 py-3.5 text-sm bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-my-teal focus:border-transparent transition-all"
            />
          </div>

          <!-- Phone Number Input -->
          <div class="relative">
            <div
              class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="w-4 h-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"
                />
              </svg>
            </div>
            <input
              type="tel"
              placeholder="Nomor WhatsApp"
              id="registerPhone"
              required
              class="w-full pl-12 pr-4 py-3.5 text-sm bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-my-teal focus:border-transparent transition-all"
            />
          </div>

          <!-- Password Input -->
          <div class="relative">
            <div
              class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                />
              </svg>
            </div>
            <input
              type="password"
              placeholder="Password"
              id="registerPassword"
              required
              minlength="6"
              class="w-full pl-12 pr-12 py-3.5 text-sm bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-my-teal focus:border-transparent transition-all"
            />
            <button
              type="button"
              onclick="togglePassword('registerPassword', this)"
              class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="w-5 h-5 eye-icon"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
              </svg>

              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="w-5 h-5 eye-slash-icon hidden"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
                />
              </svg>
            </button>
          </div>

          <!-- Register Button -->
          <button
            type="submit"
            class="w-full bg-my-teal text-white py-3.5 rounded-2xl font-medium hover:bg-opacity-90 transition-all shadow-lg hover:shadow-xl mt-6"
          >
            Daftar
          </button>
        </form>

        <!-- Alert Message -->
        <div id="alertMessage" class="hidden mt-4 p-4 rounded-xl text-sm"></div>
      </div>
    </div>
  </body>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <!-- Custom JavaScript Files -->
  <script src="/js/config/firebase-config.js"></script>
  <script src="/js/login/login.js"></script>
  <script src="/js/login/auth.js"></script>
</html>
