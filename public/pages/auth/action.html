<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aksi - Greenuity</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#1B4D57",
              dark: "#173D45",
            },
            fontFamily: { poppins: ["Poppins", "sans-serif"] },
          },
        },
      };
    </script>
  </head>

  <body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 font-poppins">

    <div id="container" class="bg-white w-full max-w-md rounded-3xl shadow-xl p-8 text-center hidden">
      
      <img
        src="../../assets/logo/logo-greenuity.svg"
        class="w-20 mx-auto mb-4"
      />

      <h1 id="title" class="text-2xl font-semibold mb-2"></h1>
      <p id="description" class="text-gray-600 text-sm mb-6"></p>

      <!-- Reset Password Form -->
      <form id="resetPasswordForm" class="space-y-4 hidden">
        <input
          type="password"
          id="newPassword"
          placeholder="Password Baru"
          class="w-full px-4 py-3.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-primary"
          required
        />
        <button
          type="submit"
          class="w-full py-3 bg-primary text-white rounded-xl font-semibold hover:bg-primary/90 transition"
        >
          Simpan Password
        </button>
      </form>

      <!-- Button to login -->
      <a
        id="loginButton"
        href="login.html"
        class="hidden mt-6 inline-block w-full py-3 bg-primary text-white rounded-xl font-semibold hover:bg-primary/90 transition"
      >
        Kembali ke Login
      </a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script src="/js/config/firebase-config.js"></script>
    <script src="/js/action-handler.js"></script>
  </body>
</html>
