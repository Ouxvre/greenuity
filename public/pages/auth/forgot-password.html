<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lupa Password - Greenuity</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { poppins: ["Poppins", "sans-serif"] },
            colors: {
              primary: "#1B4D57",
              dark: "#173D45",
            },
          },
        },
      };
    </script>
  </head>

  <body class="flex justify-center items-center min-h-screen p-4">
    <!-- Card Wrapper -->
    <div
      class="bg-white w-full max-w-md min-h-[90vh] px-7 py-10"
    >
      <!-- Back Button -->
      <button
        onclick="history.back()"
        class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white shadow-md hover:bg-primary/90"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 19l-7-7 7-7"
          />
        </svg>
      </button>

      <!-- Logo -->
      <div class="flex flex-col items-center mt-6 mb-8">
        <img src="../../assets/logo/logo-greenuity.svg" class="w-16 mb-2" />
        <p class="font-semibold text-lg text-primary">GREENUITY</p>
      </div>

      <!-- Title -->
      <h1 class="text-center text-2xl font-semibold mb-2">Lupa Password</h1>
      <p class="text-center text-gray-600 text-sm mb-8 px-4">
        Masukkan email kamu untuk menerima link reset password.
      </p>

      <!-- Alert -->
      <div id="alertMessage" class="hidden mb-4 p-4 rounded-xl text-sm"></div>

      <!-- Form -->
      <form id="forgotForm" class="space-y-5">
        <div>
          <input
            type="email"
            id="forgotEmail"
            placeholder="Email Address"
            class="w-full px-4 py-3.5 bg-gray-50 border border-gray-300 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-primary transition"
            required
          />
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full py-3.5 bg-primary text-white rounded-full font-semibold text-sm shadow-lg hover:bg-primary/90 transition"
        >
          Kirim
        </button>
      </form>
    </div>

    <!-- Modal Success -->
    <div
      id="successModal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"
    >
      <div
        class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-xl"
      >
        <div
          class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6"
        >
          <svg
            class="w-10 h-10 text-green-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
        <h3 class="text-2xl font-bold text-gray-800 mb-2">Berhasil!</h3>
        <p class="text-gray-600 mb-6 text-sm">
          Link reset password sudah dikirim ke email kamu.
        </p>
        <button
          onclick="closeSuccessModal()"
          class="w-full py-3 bg-primary text-white rounded-xl font-semibold hover:bg-primary/90 transition"
        >
          OK
        </button>
      </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="/js/config/firebase-config.js"></script>

    <!-- Custom JS -->
    <script src="/js/login/forgot-password.js"></script>
  </body>
</html>
