<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification - Greenuity</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#1B4D57",
              dark: "#173D45",
            },
            fontFamily: { poppins: ["Poppins", "sans-serif"] },
          },
        },
      };
    </script>

    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fadeIn {
        animation: fadeIn 0.35s ease-out;
      }
    </style>
  </head>

  <body
    class="bg-gray-100 flex items-center justify-center min-h-screen p-6 font-poppins"
  >
    <!-- CARD -->
    <div
      id="card"
      class="bg-white w-full max-w-md rounded-3xl shadow-lg p-8 text-center fadeIn hidden"
    >
      <!-- Logo -->
      <img
        src="../../assets/logo/logo-greenuity.svg"
        class="w-20 mx-auto mb-4"
      />

      <h1 id="title" class="text-2xl font-semibold mb-2">Memverifikasi...</h1>
      <p id="description" class="text-gray-600 text-sm mb-8">
        Mohon tunggu sebentar.
      </p>

      <!-- Success Icon -->
      <div id="successIcon" class="hidden">
        <div
          class="w-20 h-20 mx-auto rounded-full bg-green-100 flex items-center justify-center"
        >
          <svg
            class="w-10 h-10 text-green-500 mb-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
      </div>

      <!-- Error Icon -->
      <div id="errorIcon" class="hidden">
        <div
          class="w-20 h-20 mx-auto rounded-full bg-red-100 flex items-center justify-center mb-6"
        >
          <svg
            class="w-10 h-10 text-red-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 
                 0 2.502-1.667 1.732-3L13.732 
                 4c-.77-1.333-2.694-1.333-3.464 
                 0L3.34 14c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        </div>
      </div>

      <!-- Login Button -->
      <a
        id="loginButton"
        href="login.html"
        class="hidden block w-full bg-primary text-white py-3 rounded-xl font-semibold text-center hover:bg-primary/90 transition"
      >
        Kembali ke Login
      </a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script src="/js/config/firebase-config.js"></script>

    <!-- Verification Logic -->
    <script src="/js/login/verify-email.js"></script>
  </body>
</html>
