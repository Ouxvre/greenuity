<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Kata Sandi - Greenuity</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { poppins: ["Poppins", "sans-serif"] },
            colors: {
              primary: "#1B4D57",
              dark: "#173D45",
            },
          },
        },
      };
    </script>
  </head>

  <body class="flex justify-center items-center min-h-screen p-4">
    <!-- Card Wrapper -->
    <div class="bg-white w-full max-w-md min-h-[90vh] px-7 py-10">
      <!-- Back Button -->
      <button
        onclick="history.back()"
        class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white shadow-md hover:bg-primary/90"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 19l-7-7 7-7"
          />
        </svg>
      </button>

      <!-- Logo -->
      <div class="flex flex-col items-center mt-6 mb-8">
        <img src="../../assets/logo/logo-greenuity.svg" class="w-16 mb-2" />
        <p class="font-semibold text-lg text-primary">GREENUITY</p>
      </div>

      <!-- Title -->
      <h1 class="text-center text-2xl font-semibold mb-4">Reset kata sandi</h1>
      <p class="text-center text-gray-600 text-sm mb-8 px-4">
        Gunakan minimal 6 karakter dengan kombinasi huruf, angka, dan simbol.
      </p>

      <!-- Form -->
      <form id="resetPasswordForm" class="space-y-5">
        <!-- Password Baru -->
        <div>
          <label class="text-sm font-medium text-gray-700 mb-1 block">
            kata sandi baru
          </label>

          <div class="relative">
            <input
              type="password"
              id="newPassword"
              minlength="6"
              placeholder="Masukkan kata sandi baru"
              required
              class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-primary outline-none"
            />

            <button
              type="button"
              onclick="togglePassword('newPassword', this)"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500"
            >
              <!-- Eye -->
              <svg
                class="w-6 h-6 eye-icon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 
                  7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 
                  7.178.07.207.07.431 0 .639C20.577 16.49 16.64 
                  19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
              </svg>

              <!-- Eye Off -->
              <svg
                class="w-6 h-6 eye-off-icon hidden"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 0 0 1.934 
                  12C3.226 16.338 7.244 19.5 12 19.5c.993 
                  0 1.953-.138 2.863-.395M6.228 6.228A10.451 
                  10.451 0 0 1 12 4.5c4.756 0 8.773 
                  3.162 10.065 7.498a10.522 10.522 0 0 
                  1-4.293 5.774M6.228 6.228 3 3m3.228 
                  3.228 3.65 3.65m7.894 7.894L21 
                  21m-3.228-3.228-3.65-3.65m0 
                  0a3 3 0 1 0-4.243-4.243m4.242 
                  4.242L9.88 9.88"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="text-sm font-medium text-gray-700 mb-1 block">
            Konfirmasi kata sandi
          </label>

          <div class="relative">
            <input
              type="password"
              id="confirmPassword"
              minlength="6"
              placeholder="Ketik ulang kata sandi baru"
              required
              class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-primary outline-none"
            />

            <button
              type="button"
              onclick="togglePassword('confirmPassword', this)"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500"
            >
              <svg
                class="w-6 h-6 eye-icon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 
                  7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 
                  7.178.07.207.07.431 0 .639C20.577 16.49 16.64 
                  19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
              </svg>

              <svg
                class="w-6 h-6 eye-off-icon hidden"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 0 0 1.934 
                  12C3.226 16.338 7.244 19.5 12 19.5c.993 
                  0 1.953-.138 2.863-.395M6.228 6.228A10.451 
                  10.451 0 0 1 12 4.5c4.756 0 8.773 
                  3.162 10.065 7.498a10.522 10.522 0 0 
                  1-4.293 5.774M6.228 6.228 3 3m3.228 
                  3.228 3.65 3.65m7.894 7.894L21 
                  21m-3.228-3.228-3.65-3.65m0 
                  0a3 3 0 1 0-4.243-4.243m4.242 
                  4.242L9.88 9.88"
                />
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-primary text-white py-3 rounded-full text-center font-semibold mt-4 hover:bg-primary/90 transition"
        >
          lanjutkan
        </button>
      </form>
    </div>

    <!-- Modal Success -->
    <div
      id="successModal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"
    >
      <div
        class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-xl"
      >
        <div
          class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6"
        >
          <svg
            class="w-10 h-10 text-green-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
        <h3 class="text-2xl font-bold text-gray-800 mb-2">Berhasil!</h3>
        <p class="text-gray-600 mb-6 text-sm">Password anda telah terganti.</p>
        <button
          onclick="closeSuccessModal()"
          class="w-full py-3 bg-primary text-white rounded-xl font-semibold hover:bg-primary/90 transition"
        >
          OK
        </button>
      </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Firebase Config -->
    <script src="/js/config/firebase-config.js"></script>

    <!-- RESET PASSWORD LOGIC -->
    <script src="/js/login/reset-password.js"></script>

    <!-- Password Toggle -->
    <script>
      function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const eye = btn.querySelector(".eye-icon");
        const eyeOff = btn.querySelector(".eye-off-icon");

        if (input.type === "password") {
          input.type = "text";
          eye.classList.add("hidden");
          eyeOff.classList.remove("hidden");
        } else {
          input.type = "password";
          eye.classList.remove("hidden");
          eyeOff.classList.add("hidden");
        }
      }
    </script>

    <!-- Success Modal Close -->
    <script>
      function closeSuccessModal() {
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
