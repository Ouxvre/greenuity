<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Info Sensor | Greenuity</title>
    <link
      rel="icon"
      type="image/png"
      href="/../assets/logo/logo-greenuity.svg"
    />

    <!-- TailwindCSS + Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- google font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#1B4D57",
              "primary-light": "#2D6670",
              accent: "#E67E22",
              soft: "#F8FAF8",
            },
            fontFamily: { poppins: ["Poppins", "sans-serif"] },
          },
        },
      };
    </script>
  </head>

  <body class="bg-soft font-poppins min-h-screen">
    <!-- Header -->
    <header class="px-6 py-4 top-0 z-10">
      <div class="flex items-center justify-between px-5 py-4">
        <!-- Tombol Back -->
        <button
          onclick="history.back()"
          class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white shadow-md hover:bg-primary/90"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>

        <!-- Title -->
        <h1 class="font-semibold text-lg text-gray-800">Data Sensors</h1>

        <!-- Tombol Settings -->
        <button
          onclick="openSettings()"
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-7 h-7"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
        </button>
      </div>
    </header>

    <!-- Device Info -->
    <section class="px-6 mt-5 text-center">
      <div
        class="bg-gradient-to-r from-primary to-primary-light rounded-3xl text-white py-6 shadow-lg"
      >
        <h2 id="deviceName" class="text-xl font-semibold mb-1">Memuat...</h2>
        <p class="text-sm opacity-90">
          Device ID: <span id="deviceIdDisplay" class="font-mono"></span>
        </p>
        <p class="text-xs opacity-70 mt-2" id="lastActive">
          Terakhir diperbarui: -
        </p>
      </div>
    </section>

    <!-- Sensor Cards -->
    <section class="px-6 mt-6 grid grid-cols-2 gap-4">
      <div class="bg-white rounded-2xl p-5 shadow-md text-center">
        <p class="text-gray-500 text-sm mb-1">🌡️ Suhu</p>
        <h3 id="suhu" class="text-2xl font-bold text-primary">-- °C</h3>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-md text-center">
        <p class="text-gray-500 text-sm mb-1">💧 Kelembapan Udara</p>
        <h3 id="kelembapan_udara" class="text-2xl font-bold text-primary">
          -- %
        </h3>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-md text-center">
        <p class="text-gray-500 text-sm mb-1">🌱 Kelembapan Tanah</p>
        <h3 id="kelembapan_tanah" class="text-2xl font-bold text-primary">
          -- %
        </h3>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-md text-center">
        <p class="text-gray-500 text-sm mb-1">☀️ Cahaya</p>
        <h3 id="cahaya" class="text-2xl font-bold text-primary">-- lux</h3>
      </div>
    </section>

    <!-- Grafik -->
    <section class="px-6 mt-8 mb-20">
      <div
        class="bg-white rounded-3xl shadow-lg p-5 relative h-[320px] sm:h-[360px]"
      >
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-gray-800 text-lg">
            Grafik Sensor (Realtime)
          </h2>
          <span id="updateTime" class="text-xs text-gray-400">Realtime</span>
        </div>
        <canvas id="sensorChart" class="w-full h-full"></canvas>
      </div>
    </section>

    <!-- AI Insight -->
    <section class="px-6 mt-8 mb-24">
      <div
        id="aiBox"
        class="bg-gradient-to-br from-primary-light to-primary rounded-3xl text-white p-6 shadow-lg"
      >
        <h3 class="text-lg font-semibold mb-2">🧠 Insight Cerdas Greenuity</h3>
        <p id="aiText" class="text-sm opacity-90 leading-relaxed">
          Menganalisis data sensor untuk memberikan saran terbaik...
        </p>
      </div>
    </section>

    <!-- SETTINGS MODAL -->
    <div
      id="settingsModal"
      class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm hidden flex items-center justify-center z-50"
    >
      <div class="bg-white rounded-2xl w-[90%] max-w-sm p-6 shadow-xl">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">
          Pengaturan Device
        </h2>

        <!-- Edit Nama -->
        <label class="block text-sm text-gray-600 mb-1">Nama Device</label>
        <input
          id="inputNamaDevice"
          class="w-full px-3 py-2 border rounded-lg focus:ring-primary focus:outline-none mb-4"
          placeholder="Nama Lahan"
        />

        <!-- Edit Lokasi -->
        <label class="block text-sm text-gray-600 mb-1"
          >Lokasi (opsional)</label
        >
        <input
          id="inputLokasi"
          class="w-full px-3 py-2 border rounded-lg focus:ring-primary focus:outline-none mb-4"
          placeholder="Contoh: Greenhouse A"
        />

        <!-- Buttons -->
        <div class="flex justify-between mt-5">
          <button
            onclick="closeSettings()"
            class="px-4 py-2 rounded-lg bg-gray-200 text-gray-800"
          >
            Batal
          </button>

          <button
            onclick="saveSettings()"
            class="px-4 py-2 rounded-lg bg-primary text-white"
          >
            Simpan
          </button>
        </div>

        <hr class="my-4" />

        <!-- Restart Device -->
        <button
          onclick="restartDevice()"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-primary-light text-white hover:bg-primary transition mb-3"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 
         3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 
         13.803-3.7l3.181 3.182m0-4.991v4.99"
            />
          </svg>
          <span>Restart Device</span>
        </button>

        <!-- Delete Device -->
        <button
          onclick="deleteDevice()"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-red-500 text-white hover:bg-red-600 transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21
         c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 
         2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 
         1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 
         0-3.478-.397m-12 .562c.34-.059.68-.114 
         1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 
         0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 
         51.964 0 0 0-3.32 0c-1.18.037-2.09 
         1.022-2.09 2.201v.916m7.5 0a48.667 48.667 
         0 0 0-7.5 0"
            />
          </svg>
          <span>Hapus Device</span>
        </button>
      </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="/js/config/firebase-config.js"></script>

    <!-- Info Sensor Script -->
    <script src="/js/monitoring/info-sensor.js"></script>
  </body>
</html>
