<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Scan Tanaman - Greenuity</title>
    <link rel="icon" href="/assets/logo/logo-greenuity.svg" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- TensorFlow -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: "#1B4D57" },
            fontFamily: { poppins: ["Poppins", "sans-serif"] },
          },
        },
      };
    </script>

    <style>
      video {
        border-radius: 12px;
      }
    </style>
  </head>

  <body class="bg-gray-50 min-h-screen font-poppins pb-28">
    <!-- HEADER -->
    <header class="px-6 py-4 top-0 z-10">
      <div class="flex items-center justify-between mt-8">
        <div class="w-10"></div>
        <h1 class="text-lg font-bold text-primary">Greenuity AI Analisis</h1>
        <div class="w-10"></div>
      </div>
    </header>

    <!-- MAIN WRAPPER -->
    <main class="px-6">
      <div
        class="w-full max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6 mt-2"
      >
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- CARD IDENTIFIKASI -->
          <div
            class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 hover:shadow-xl transition"
          >
            <h2 class="text-xl font-semibold text-primary mb-2">
              Pengenalan Tanaman
            </h2>
            <p class="text-gray-600 mb-4">
              Kenali jenis tanaman secara otomatis menggunakan AI.
            </p>
            <button
              onclick="location.href='identify-plant.html'"
              class="w-full bg-primary text-white py-3 rounded-xl font-medium hover:bg-[#163f48] transition"
            >
              Mulai Scan Tanaman
            </button>
          </div>

          <!-- CARD DIAGNOSIS -->
          <div
            class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 hover:shadow-xl transition"
          >
            <h2 class="text-xl font-semibold text-primary mb-2">
              Diagnosis Penyakit Daun
            </h2>
            <p class="text-gray-600 mb-4">
              Deteksi penyakit tanaman berdasarkan foto daun.
            </p>
            <button
              onclick="location.href='diagnose-leaf.html'"
              class="w-full bg-primary text-white py-3 rounded-xl font-medium hover:bg-[#163f48] transition"
            >
              Mulai Diagnosis Daun
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-4 left-4 right-4 z-50">
      <div
        class="bg-white rounded-3xl shadow-2xl px-6 py-3 border border-gray-100"
      >
        <div class="flex items-center justify-around">
          <button
            onclick="goToHome()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-primary transition"
          >
            <svg
              class="w-7 h-7"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            <span class="text-[10px]">Beranda</span>
          </button>

          <button
            onclick="goToMonitoring()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-primary transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              />
            </svg>
            <span class="text-[10px]">Monitoring</span>
          </button>

          <button
            onclick="goToIrrigation()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-primary transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"
              />
            </svg>
            <span class="text-[10px]">Irigasi</span>
          </button>

          <button
            onclick="goToAnalysis()"
            class="flex flex-col items-center space-y-1 text-primary"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-7 h-7"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M7.5 3.75H6A2.25 2.25 0 0 0 3.75 6v1.5M16.5 3.75H18A2.25 2.25 0 0 1 20.25 6v1.5m0 9V18A2.25 2.25 0 0 1 18 20.25h-1.5m-9 0H6A2.25 2.25 0 0 1 3.75 18v-1.5M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              />
            </svg>
            <span class="text-[10px] font-semibold">Scan</span>
          </button>

          <button
            onclick="goToProfile()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-primary transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <span class="text-[10px]">Profil</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- MAIN LOGIC -->
    <script src="/js/ai/analysis.js"></script>
  </body>
</html>
