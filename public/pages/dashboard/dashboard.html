<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenuity - Dashboard</title>
    <link
      rel="icon"
      type="image/png"
      href="/../assets/logo/logo-greenuity.svg"
    />

    <!-- tailwindcss -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- google font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              poppins: ["Poppins", "sans-serif"],
            },
            colors: {
              primary: "#1B4D57",
              "primary-light": "#2D6670",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-50 font-poppins pb-24">
    <!-- Header with Weather Background -->
    <div
      class="relative text-white pb-32 pt-8 px-6 rounded-b-[2.5rem]"
      style="background: #1b4d57"
    >
      <!-- Top Bar -->
      <div class="flex items-center justify-between mb-8">
        <div
          class="flex items-center space-x-2 bg-white/20 backdrop-blur-sm px-3 py-2 rounded-full"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path
              fill-rule="evenodd"
              d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z"
              clip-rule="evenodd"
            />
          </svg>
          <span class="text-sm" id="userLocation"></span>
        </div>

        <div class="flex items-center space-x-3">
          <button
            class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center hover:bg-white/30 transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
              />
            </svg>
          </button>
          <div
            class="w-11 h-11 rounded-full bg-white/30 backdrop-blur-sm overflow-hidden border-2 border-white/50"
          >
            <img
              id="profileImage"
              src="../../assets/foto-default.jpeg"
              class="w-full h-full object-cover"
            />
          </div>
        </div>
      </div>

      <!-- Weather Info -->
      <div class="space-y-2">
        <h2 class="text-lg font-medium">
          Hello, <span id="userName" class="font-semibold">Loading...</span>
        </h2>
        <div class="flex items-end space-x-3">
          <h1 class="text-6xl font-bold" id="temperature"></h1>
          <div class="pb-2 space-y-1">
            <div class="flex items-center space-x-2 text-sm">
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"
                />
              </svg>
              <span id="weatherDesc"></span>
            </div>
            <p class="text-sm opacity-90" id="currentDate"></p>
          </div>
        </div>

        <div class="flex items-center space-x-4 text-sm opacity-90 mt-3">
          <div class="flex items-center space-x-1">
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M14 5l7 7m0 0l-7 7m7-7H3"
              />
            </svg>
            <span id="windSpeed"></span>
          </div>
          <div class="flex items-center space-x-1">
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"
              />
            </svg>
            <span id="humidity"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Menu Grid -->
    <div class="px-6 -mt-20 relative z-10">
      <div class="bg-white rounded-3xl p-6 shadow-lg mb-24">
        <div class="grid grid-cols-4 gap-4">
          <!-- Identify -->
          <button
            onclick="goToIdentify()"
            class="flex flex-col items-center gap-2 group"
          >
            <div
              class="w-12 h-12 bg-yellow-50 rounded-2xl flex items-center justify-center text-yellow-500 group-hover:bg-yellow-100 transition-colors"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            </div>
            <span class="text-[10px] font-medium text-yellow-500"
              >Identify</span
            >
          </button>

          <!-- Plant Care -->
          <button
            onclick="goToPlantCare()"
            class="flex flex-col items-center gap-2 group"
          >
            <div
              class="w-12 h-12 bg-green-50 rounded-2xl flex items-center justify-center text-green-500 group-hover:bg-green-100 transition-colors"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
                />
              </svg>
            </div>
            <span class="text-[10px] font-medium text-green-500"
              >Plant Care</span
            >
          </button>

          <!-- Diagnose -->
          <button
            onclick="goToDiagnose()"
            class="flex flex-col items-center gap-2 group"
          >
            <div
              class="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center text-red-500 group-hover:bg-red-100 transition-colors"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4v16m8-8H4"
                />
              </svg>
            </div>
            <span class="text-[10px] font-medium text-red-500">Diagnose</span>
          </button>

          <!-- AI Chat -->
          <button
            onclick="goToAIChat()"
            class="flex flex-col items-center gap-2 group"
          >
            <div
              class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-500 group-hover:bg-blue-100 transition-colors"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
                />
              </svg>
            </div>
            <span class="text-[10px] font-medium text-blue-500">AI Chat</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Tips & Artikel Section -->
    <div class="px-6 mb-24">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-gray-800">Tips & Artikel</h3>
        <a href="#" class="text-sm text-primary font-medium hover:underline"
          >Lihat Semua</a
        >
      </div>

      <div class="space-y-4">
        <!-- Article 1 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm flex gap-4 items-center">
          <img
            src="https://images.unsplash.com/photo-1591857177580-dc82b9bf4e1d?w=200"
            alt="Tips 1"
            class="w-20 h-20 rounded-xl object-cover flex-shrink-0"
          />
          <div>
            <span
              class="text-[10px] bg-green-100 text-green-600 px-2 py-1 rounded-full font-medium"
              >Tips</span
            >
            <h4 class="font-bold text-gray-800 text-sm mt-1 line-clamp-2">
              Cara Merawat Tanaman Cabai di Musim Hujan
            </h4>
            <p class="text-[10px] text-gray-500 mt-1">5 menit baca</p>
          </div>
        </div>

        <!-- Article 2 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm flex gap-4 items-center">
          <img
            src="https://images.unsplash.com/photo-1628352081506-83c43123ed6d?w=200"
            alt="Tips 2"
            class="w-20 h-20 rounded-xl object-cover flex-shrink-0"
          />
          <div>
            <span
              class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded-full font-medium"
              >Berita</span
            >
            <h4 class="font-bold text-gray-800 text-sm mt-1 line-clamp-2">
              Teknologi IoT Terbaru untuk Pertanian Modern
            </h4>
            <p class="text-[10px] text-gray-500 mt-1">3 menit baca</p>
          </div>
        </div>

        <!-- Article 3 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm flex gap-4 items-center">
          <img
            src="https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=200"
            alt="Tips 3"
            class="w-20 h-20 rounded-xl object-cover flex-shrink-0"
          />
          <div>
            <span
              class="text-[10px] bg-yellow-100 text-yellow-600 px-2 py-1 rounded-full font-medium"
              >Edukasi</span
            >
            <h4 class="font-bold text-gray-800 text-sm mt-1 line-clamp-2">
              Manfaat Pupuk Organik Cair untuk Sayuran
            </h4>
            <p class="text-[10px] text-gray-500 mt-1">7 menit baca</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-4 left-4 right-4 z-50">
      <div class="bg-white rounded-3xl shadow-2xl px-6 py-3">
        <div class="flex items-center justify-around">
          <button
            onclick="goToHome()"
            class="flex flex-col items-center space-y-1 text-primary"
          >
            <svg
              class="w-7 h-7"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            <span class="text-[10px] font-semibold">Beranda</span>
          </button>

          <button
            onclick="goToMonitoring()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-gray-600 transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              />
            </svg>
            <span class="text-[10px]">Monitoring</span>
          </button>

          <button
            onclick="goToIrrigation()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-gray-600 transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"
              />
            </svg>
            <span class="text-[10px]">Irigasi</span>
          </button>

          <button
            onclick="goToEducation()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-gray-600 transition"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"
              />
            </svg>

            <span class="text-[10px]">Edukasi</span>
          </button>

          <button
            onclick="goToProfile()"
            class="flex flex-col items-center space-y-1 text-gray-400 hover:text-gray-600 transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <span class="text-[10px]">Profil</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="/../js/config/firebase-config.js"></script>

    <!-- Dashboard scripts -->
    <script src="/js/dashboard.js"></script>
  </body>
</html>
